<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX | Sports Ranking</title>
    <meta name="description" content="Plataforma líder para seguimiento de puntajes y rankings deportivos en Tarija. Vive la pasión de APEX.">
    <meta name="keywords" content="deportes, ranking, APEX, Tarija, marcadores en vivo, aleman del sud">
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.png">
</head>
<body>
    <div class="bg-elements">
        <div class="sphere s1"></div>
        <div class="sphere s2"></div>
        <div class="torus t1"></div>
    </div>

    <main id="login-screen">
        <header class="logo-section">
            <h1 class="main-logo">APEX</h1>
            <img src="logo.svg" width="100" height="100">
            <div class="logo-sub">Multi-Sport Ranking System</div>
            <p class="tagline">Fútbol • Vóley • Básquet</p>
        </header>

        <div class="cards-row">
            <div class="login-card">
                <div class="card-icon">👁️</div>
                <div class="card-info">
                    <h2 class="card-title">Espectador</h2>
                    <p class="card-desc">Ver tabla de posiciones y resultados en vivo.</p>
                </div>
                <button class="btn-primary" onclick="location.href='ranking.html'">Ver Ranking →</button>
            </div>

            <div class="login-card editor-card">
                <div class="card-icon">✏️</div>
                <div class="card-info">
                    <h2 class="card-title gold">Editor</h2>
                    <p class="card-desc">Gestión de puntos, faltas y posiciones.</p>
                </div>
                <div class="login-form">
                    <input type="password" id="pw-input" class="inp" placeholder="Contraseña de acceso"
                        onkeydown="if(event.key==='Enter')loginEditor()">
                    <p id="pw-error" class="error-msg">Contraseña incorrecta</p>
                    <button class="btn-editor" onclick="loginEditor()">Ingresar al Panel</button>
                </div>
            </div>
        </div>

        <footer class="footer-hint">
            <p>Acceso administrativo: <b>atletismo2025</b></p>
        </footer>
    </main>

    <div id="notification-area"></div>

    <script>
function loginEditor() {
    const pwInput = document.getElementById('pw-input');
    const pw = pwInput.value;
    const area = document.getElementById('notification-area');

    if (pw === 'atletismo2025') {
        // --- ÉXITO: Redirige a editor.html ---
        const toast = document.createElement('div');
        toast.className = 'glass-toast';
        toast.innerHTML = `
            <div style="font-size: 1.5rem">🏆</div>
            <div>
                <strong style="display:block; letter-spacing: 1px;">ACCESO APEX</strong>
                <span style="font-size: 0.8rem; opacity: 0.8;">Ingresando en 3 segundos...</span>
            </div>
            <div class="toast-timer-bar"></div>
        `;
        area.appendChild(toast);

        setTimeout(() => {
            window.location.href = 'editor.html'; 
        }, 3000); // Lo bajé a 3 segundos para que sea más rápido

    } else {
        // --- ERROR: Notificación roja y sacudida ---
        const errorToast = document.createElement('div');
        errorToast.className = 'glass-toast error shake'; 
        errorToast.innerHTML = `
            <div class="error-icon" style="color: #ff4d4d; font-weight: bold; margin-right: 10px;">✕</div>
            <div>
                <strong style="display:block; letter-spacing: 1px;">ERROR DE ACCESO</strong>
                <span style="font-size: 0.8rem; opacity: 0.8;">Contraseña incorrecta.</span>
            </div>
        `;
        area.appendChild(errorToast);

        pwInput.value = '';
        pwInput.focus();

        setTimeout(() => {
            errorToast.style.opacity = '0';
            errorToast.style.transform = 'translateX(120%)';
            errorToast.style.transition = 'all 0.5s ease';
            setTimeout(() => errorToast.remove(), 500);
        }, 3000);
    }
}
    </script>

    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
